<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Member Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="bg-cream d-flex flex-column min-vh-100" data-bs-theme="light">
    <!--NAVBAR CODE-->
    <nav class="navbar navbar-expand-md sticky-top bg-uh-red">
      <div class="container-fluid">
        <a class="navbar-brand me-auto" href="./index.html">
          <img
            src="./LOGOS-ASME/2026-2027_ASME-UH_Official_Logo_White-navbar.png"
            alt="UH-ASME Logo"
            width="60"
            class="d-inline-block align-text-top me-2"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvas"
          aria-controls="offcanvas"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="offcanvas offcanvas-end"
          tabindex="-1"
          id="offcanvas"
          aria-labelledby="offcanvasLabel"
        >
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasLabel">UH-ASME</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="offcanvas"
              aria-label="Close"
            ></button>
          </div>
          <div class="offcanvas-body">
            <ul class="navbar-nav flex-grow-1 justify-content-center gap-3">
              <li class="nav-item">
                <a class="nav-link" href="./index.html">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./about.html">About Us</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./join-us.html">Join Us</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./gallery.html">Gallery</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="./our-team.html">Our Team</a>
              </li>
            </ul>
            <a href="#" id="logoutBtn" class="btn btn-danger mt-3 mt-md-0"
              >Logout</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- HERO SECTION -->
    <div class="container-fluid text-center py-5 mb-5">
      <h1 class="display-4 fw-bold text-body-emphasis">Member Dashboard</h1>
      <p class="fs-5 text-body-secondary">
        Welcome back, <span id="memberName" class="text-danger"></span>!
      </p>
    </div>

    <!-- DASHBOARD CONTENT -->
    <main class="flex-grow-1 d-flex align-items-center py-5">
      <div class="container">
        <div
          class="card mx-auto shadow-lg bg-cream border border-2 border-danger rounded-4"
          style="max-width: 600px"
        >
          <div class="card-body p-5 text-center">
            <h3 class="card-title mb-4">Your Member Information</h3>
            <p class="lead">Points: <strong id="displayPoints"></strong></p>
            <hr class="my-4 border-danger" />
            <p class="text-muted">
              Participate in events and projects to earn more points!
            </p>
            <a href="./gallery.html" class="btn btn-danger mt-3"
              >Explore Projects & Events</a
            >
          </div>
        </div>
      </div>
    </main>

    <!--FOOTER CODE-->
    <div class="container-fluid">
      <footer class="py-3 my-4">
        <ul class="nav justify-content-center border-bottom pb-3 mb-3">
          <li class="nav-item">
            <a href="./index.html" class="nav-link px-2 text-body-secondary"
              >Home</a
            >
          </li>
          <li class="nav-item">
            <a href="./about.html" class="nav-link px-2 text-body-secondary"
              >About</a
            >
          </li>
          <li class="nav-item">
            <a
              href="https://discord.gg/wUkkzKJRAm"
              target="_blank"
              class="nav-link px-2 text-body-secondary"
              >Discord</a
            >
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link px-2 text-body-secondary">FAQs</a>
          </li>
          <li class="nav-item">
            <a href="./our-team.html" class="nav-link px-2 text-body-secondary"
              >Contact Us</a
            >
          </li>
        </ul>
        <p class="text-center text-body-secondary">© 2026 ASME-UH</p>
      </footer>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- Supabase and auth.js scripts -->
    <!-- Load Supabase CDN First -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Load your centralized logic -->
    <script src="auth.js"></script>
  </body>
</html>
